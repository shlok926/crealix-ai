<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7931E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9D4EDD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5A189A;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#0F0F1E" stroke="url(#grad1)" stroke-width="2" filter="url(#shadow)"/>

  <!-- Main Creative Circle with Spark -->
  <g filter="url(#shadow)">
    <!-- Left circle (Orange - Creativity) -->
    <circle cx="75" cy="100" r="35" fill="url(#grad1)" opacity="0.9"/>
    
    <!-- Right circle (Purple - AI/Tech) -->
    <circle cx="125" cy="100" r="35" fill="url(#grad2)" opacity="0.9"/>
    
    <!-- Center overlap effect -->
    <circle cx="100" cy="100" r="20" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- AI Text/Symbol in center -->
  <g filter="url(#shadow)">
    <!-- Brain-like AI symbol -->
    <circle cx="100" cy="95" r="8" fill="white"/>
    <circle cx="92" cy="103" r="4" fill="white" opacity="0.8"/>
    <circle cx="108" cy="103" r="4" fill="white" opacity="0.8"/>
    
    <!-- Connecting lines for neural network feel -->
    <line x1="100" y1="103" x2="92" y2="103" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="100" y1="103" x2="108" y2="103" stroke="white" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Spark/Rocket element (top right) -->
  <g filter="url(#shadow)" transform="translate(140, 70)">
    <!-- Rocket shape -->
    <path d="M 0 0 L 3 -8 L 2 -3 L 5 -3 L 2 0 L 2 3 L -2 3 L -2 0 Z" fill="url(#grad1)"/>
    <!-- Spark trail -->
    <circle cx="1" cy="4" r="1" fill="#FFD60A" opacity="0.9"/>
    <circle cx="-1" cy="6" r="0.7" fill="#FFD60A" opacity="0.7"/>
  </g>

  <!-- Glow effect -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#grad1)" stroke-width="1" opacity="0.3" r="98"/>

  <!-- Text: CREALIX -->
  <text x="100" y="155" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white" letter-spacing="2">
    CREALIX
  </text>

  <!-- Subtext: AI -->
  <text x="100" y="172" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="url(#grad1)" letter-spacing="1" font-weight="600">
    AI
  </text>
</svg>