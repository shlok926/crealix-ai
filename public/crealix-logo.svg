<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" fill="#0F0F1E" rx="20"/>
  
  <!-- Outer Ring -->
  <circle cx="120" cy="120" r="110" fill="none" stroke="#FF6B35" stroke-width="2"/>
  
  <!-- Left Circle (Orange) -->
  <circle cx="85" cy="120" r="40" fill="#FF6B35" opacity="0.9"/>
  
  <!-- Right Circle (Purple) -->
  <circle cx="155" cy="120" r="40" fill="#9D4EDD" opacity="0.9"/>
  
  <!-- Center Overlap -->
  <circle cx="120" cy="120" r="25" fill="#0F0F1E"/>
  
  <!-- AI Brain Symbol (Center) -->
  <circle cx="120" cy="115" r="6" fill="#FFD60A"/>
  <circle cx="110" cy="125" r="3" fill="#FFD60A" opacity="0.8"/>
  <circle cx="130" cy="125" r="3" fill="#FFD60A" opacity="0.8"/>
  
  <!-- Connecting Lines -->
  <line x1="120" y1="121" x2="110" y2="125" stroke="#FFD60A" stroke-width="1" opacity="0.6"/>
  <line x1="120" y1="121" x2="130" y2="125" stroke="#FFD60A" stroke-width="1" opacity="0.6"/>
  
  <!-- Spark Elements -->
  <circle cx="155" cy="85" r="3" fill="#FFD60A"/>
  <circle cx="160" cy="78" r="2" fill="#FFD60A" opacity="0.7"/>
  <circle cx="150" cy="75" r="2" fill="#FFD60A" opacity="0.5"/>
  
  <!-- Text: CREALIX -->
  <text x="120" y="175" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white" letter-spacing="1">
    CREALIX
  </text>
  
  <!-- Text: AI -->
  <text x="120" y="198" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#FF6B35" font-weight="600" letter-spacing="2">
    AI
  </text>
</svg>